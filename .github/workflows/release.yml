name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v0.1.0. Empty = HEAD; will not create a GitHub Release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,      target: aarch64-apple-darwin,       cross: false }
          - { runner: macos-13,      target: x86_64-apple-darwin,        cross: false }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu,   cross: false }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu,  cross: true  }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/runcomfy" "dist/runcomfy"
          cd dist
          tar -czf "runcomfy-${{ matrix.target }}.tar.gz" runcomfy
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "runcomfy-${{ matrix.target }}.tar.gz" > "runcomfy-${{ matrix.target }}.tar.gz.sha256"
          else
            sha256sum "runcomfy-${{ matrix.target }}.tar.gz" > "runcomfy-${{ matrix.target }}.tar.gz.sha256"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: runcomfy-${{ matrix.target }}
          path: |
            dist/runcomfy-${{ matrix.target }}.tar.gz
            dist/runcomfy-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect tarballs
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: align package.json version
        working-directory: npm
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
