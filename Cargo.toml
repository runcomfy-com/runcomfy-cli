[package]
name = "runcomfy"
version = "0.1.0"
edition = "2021"
description = "RunComfy CLI — run AI media models, deploy ComfyUI workflows, train LoRAs"
license = "MIT"
repository = "https://github.com/InceptionsAI/runcomfy-website"
rust-version = "1.75"

[[bin]]
name = "runcomfy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
indicatif = "0.17"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
